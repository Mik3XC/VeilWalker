[package]
name = "vw-tor"
version = "0.1.0"
edition = "2021"
description = "Embedded Arti (Tor) for VeilWalker iOS: C ABI, HTTP to the onion service done in Rust"
license = "MIT OR Apache-2.0"

[lib]
name = "vw_tor"
crate-type = ["staticlib"]

# Arti, tokio and rustls match Android's rust/trailbound-net (Cargo.lock copied from there).
[dependencies]
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression", "static-sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "time"] }
tor-rtcompat = { version = "0.47", features = ["tokio", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
# HTTPS through a Tor exit, for the one clearnet host the app needs (api.weather.gov). Mozilla's root store,
# compiled in, so the request path is identical on every platform.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
anyhow = "1"
once_cell = "1"
# Arti's "compression" pulls in xz. Build liblzma from source on every target; otherwise the macOS slice
# links Homebrew's shared liblzma and the static library comes out with undefined symbols.
liblzma-sys = { version = "0.4", features = ["static"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Xcode strips the final app; stripping a staticlib here can drop symbols the linker needs.
strip = false

# sysinfo 0.38.4 (pulled in by Arti's tor-memquota) doesn't compile for iOS; see the patched open_files().
# Drop this once Arti moves to a sysinfo release that builds for iOS.
[patch.crates-io]
sysinfo = { path = "patches/sysinfo-0.38.4" }
